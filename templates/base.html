<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f8f3">
    <title>{% block title %}FitBuddy{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='exercise.svg') }}">
</head>
<body>
    <header class="navbar">
        <a href="/" class="brand" aria-label="FitBuddy home">
            <span class="brand-mark">FB</span><span>Fit</span><span>Buddy</span>
        </a>
        <nav aria-label="Primary navigation">
            <a href="/">Generate</a>
            <a href="/feedback">Revise a plan</a>
            <a href="/view-all-users">Admin</a>
            <a href="/docs">API Docs</a>
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>FitBuddy <strong>·</strong> AI-assisted fitness planning</p>
        <p>General wellness information only. Not medical advice.</p>
    </footer>
    <script>
        document.querySelectorAll("form").forEach(function (form) {
            form.addEventListener("submit", function () {
                var button = form.querySelector("button[type='submit']");
                if (button) {
                    button.disabled = true;
                    button.textContent = "Working...";
                }
            });
        });
        document.querySelectorAll(".workout-plan").forEach(function (plan) {
            var lines = plan.textContent.trim().split("\n");
            var days = [];
            var current = null;
            lines.forEach(function (line) {
                var text = line.trim();
                if (!text) return;
                if (/^Day\s+\d+/i.test(text)) {
                    current = document.createElement("article");
                    current.className = "day-card";
                    var heading = document.createElement("h3");
                    heading.textContent = text;
                    current.appendChild(heading);
                    days.push(current);
                } else if (current) {
                    var paragraph = document.createElement("p");
                    paragraph.textContent = text;
                    current.appendChild(paragraph);
                }
            });
            if (days.length) {
                var wrapper = document.createElement("div");
                wrapper.className = "plan-days";
                days.forEach(function (day) { wrapper.appendChild(day); });
                plan.replaceWith(wrapper);
            }
        });
    </script>
</body>
</html>
